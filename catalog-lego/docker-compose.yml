# Stack de developpement local du service LEGO.
#
# Ports decales (3010 / 3307 / 6380) : la stack du monolithe occupe deja 3000 / 3306 / 6379
# sur la meme machine, et les deux doivent pouvoir tourner ensemble.
#
# Dans la cible, ce service partage l'instance MariaDB des autres et n'a que son schema
# logique (`acv_cat_lego`) - cf. ../acervatim-docs/agent/backend/architecture-microservices.md.
# L'instance dediee ci-dessous n'est qu'une commodite de dev.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: acervatim-lego-app
    ports:
      - '3010:3010'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3010
      DATABASE_URL: 'mysql://${MARIADB_USER:-acervatim}:${MARIADB_PASSWORD:-changeme}@db:3306/${MARIADB_DATABASE:-acv_cat_lego}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  db:
    image: mariadb:10.11
    container_name: acervatim-lego-db
    ports:
      - '3307:3306'
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-acv_cat_lego}
      MARIADB_USER: ${MARIADB_USER:-acervatim}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    volumes:
      - lego_db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: acervatim-lego-redis
    ports:
      - '6380:6379'
    # noeviction : un job de moissonnage ne doit jamais etre evince sous pression memoire.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lego_db_data:
