# Gabarit du Secret de la constellation. **Ne jamais versionner la copie remplie.**
#
#   cp deploy/acervatim-secrets.example.yaml ~/acervatim/acervatim-secrets.yaml
#   chmod 600 ~/acervatim/acervatim-secrets.yaml
#   # ... remplir, puis assembler le manifeste joue :
#   cat ~/acervatim/acervatim-secrets.yaml deploy/acervatim.yaml > ~/acervatim/acervatim.yaml
#   chmod 600 ~/acervatim/acervatim.yaml
#
# `stringData` et non `data` : les valeurs sont en clair, pas en base64. C'est delibere - un
# secret encode en base64 n'est pas plus protege, seulement plus penible a relire et plus
# facile a se tromper en editant. Le fichier est en 0600 et hors du depot ; c'est la ce qui
# le protege.
---
apiVersion: v1
kind: Secret
metadata:
  name: acervatim-secrets
type: Opaque
stringData:
  # --- Connexions aux schemas ------------------------------------------------------------
  # Une URL par service, chacune sur SON schema logique de l'instance MariaDB partagee.
  #
  # Elles sont ecrites en toutes lettres plutot que composees a partir d'un mot de passe et
  # d'un nom de base : c'est verbeux, mais cela rend l'invariant central du decoupage
  # directement lisible et verifiable - **quel service touche quel schema**. Une erreur ici
  # (deux services sur le meme schema) serait autrement invisible jusqu'a la premiere
  # migration.
  #
  # `acervatim-db` est le nom du conteneur MariaDB sur le reseau Podman partage.
  DATABASE_URL_GATEWAY: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_gateway'
  DATABASE_URL_IDENTITY: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_core'
  DATABASE_URL_BILLING: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_billing'
  DATABASE_URL_CONNECTIONS: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_conn'
  DATABASE_URL_SHARING: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_sharing'
  DATABASE_URL_SEARCH: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_search'
  DATABASE_URL_CATALOG_GENERIC: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_cat_generic'
  DATABASE_URL_CATALOG_MANGA: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_cat_manga'
  DATABASE_URL_CATALOG_VINYL: 'mysql://acervatim:CHANGEME@acervatim-db:3306/acv_cat_vinyl'

  # --- Identite : le JWT emis par `identity`, verifie par le gateway ---------------------
  # Paire RSA. **`identity` est la seule autorite d'emission** de la constellation ; c'est
  # aussi le seul service dont la configuration lit la cle privee.
  #   openssl genrsa -out jwt.key 2048
  #   openssl rsa -in jwt.key -pubout -out jwt.pub
  # Newlines echappees en \n, sur une seule ligne (meme convention que le monolithe).
  JWT_PRIVATE_KEY: ''
  JWT_PUBLIC_KEY: ''

  # Audience des id_token Google verifies par POST /v1/auth/google.
  GOOGLE_CLIENT_ID: ''

  # --- Principal signe X-Acervatim-Principal (3.6) ---------------------------------------
  # Le gateway signe, les huit autres verifient. **Secret de production au meme titre que
  # SUB_HASH_PEPPER** : qui le detient peut se faire passer pour n'importe quel utilisateur
  # aupres de n'importe quel service aval.
  #   node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
  INTERNAL_PRINCIPAL_SECRET: ''

  # --- Appels de service a service (/internal/*) -----------------------------------------
  # Distinct d'ADMIN_API_TOKEN, et ce n'est pas de la coquetterie : le jeton admin est manie
  # par un humain, celui-ci circule entre processus. Les confondre ferait qu'une fuite du
  # premier donnerait `DELETE /internal/users/:id/data` sur n'importe quel compte.
  INTERNAL_SERVICE_TOKEN: ''
  ADMIN_API_TOKEN: ''

  # --- Peppers et chiffrement -------------------------------------------------------------
  # Pivot d'identite. **Sa rotation invaliderait tous les comptes** : le secret le plus
  # critique du systeme.
  SUB_HASH_PEPPER: ''
  # Codes d'invitation (crees par l'admin seul) - `billing`.
  INVITE_CODE_PEPPER: ''
  # Codes de partage (crees par n'importe quel utilisateur) - `sharing`. Pepper DEDIE :
  # surface d'exposition et cadence de rotation differentes du precedent.
  SHARE_CODE_PEPPER: ''
  # AES-256-GCM des jetons externes - `connections`. base64 de 32 octets :
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  ENCRYPTION_KEY: ''

  # --- Sources externes : cles SERVEUR (repli premium) ------------------------------------
  # Portees par `search`, qui appelle les catalogues. `connections` detient celles des
  # utilisateurs et ne transmet jamais les notres - il ne rend qu'une decision.
  # Toutes optionnelles : une source non configuree degrade en mode cache puis repond
  # `403 source-token-required`, ce qui est le comportement nominal pour un utilisateur ni
  # connecte ni premium.
  DISCOGS_CONSUMER_KEY: ''
  DISCOGS_CONSUMER_SECRET: ''
  # Token personnel d'un compte Discogs Acervatim : 60 req/min ET les images. La signature
  # consumer-seule authentifie mais ne renvoie pas les jaquettes - d'ou ce jeton EN PLUS du
  # consumer, pas a sa place.
  DISCOGS_ACERVATIM_TOKEN: ''
  # Meme valeur que dans `connections`, deux roles : identifiant du flux d'autorisation
  # la-bas, cle du repli premium (`X-MAL-CLIENT-ID`) ici.
  MAL_CLIENT_ID: ''
  MAL_CLIENT_SECRET: ''
  TMDB_API_KEY: ''
  GOOGLE_BOOKS_API_KEY: ''
  # Jeux de societe. GameUPC : cle de PRODUCTION (la cle publique de test ne vaut que sur
  # /test, videe periodiquement). Pepper : pseudonyme des votes, a ne jamais changer une
  # fois des votes emis. BGG : vide tant que la licence commerciale n'est pas ecrite.
  GAMEUPC_API_KEY: ''
  GAMEUPC_VOTER_PEPPER: ''
  BGG_API_TOKEN: ''

  # URLs de retour OAuth : elles pointent le **gateway**, pas `connections`. C'est l'adresse
  # que le fournisseur affichera et vers laquelle le navigateur reviendra.
  DISCOGS_CALLBACK_URL: 'https://api.example.org/v1/oauth/discogs/callback'
  MAL_CALLBACK_URL: 'https://api.example.org/v1/oauth/mal/callback'

  # --- Google Play Billing (`billing`) ----------------------------------------------------
  # Optionnels : sans eux, POST /v1/subscriptions/verify et le webhook RTDN repondent 503,
  # et les grants manuels continuent de rendre un compte premium.
  GOOGLE_PLAY_PACKAGE_NAME: ''
  # JSON du compte de service, encode en base64 : `private_key` contient des newlines
  # litterales qu'un fichier d'environnement ne transporte pas intact.
  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ''
  GOOGLE_PUBSUB_SA_EMAIL: ''
  GOOGLE_PUBSUB_AUDIENCE: ''
