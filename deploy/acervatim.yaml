# Manifeste Kubernetes de la constellation Acervatim, joue par `podman kube play` via le
# Quadlet `acervatim.kube`.
#
# **Ce fichier ne contient aucun secret.** Il est assemble au deploiement avec
# `acervatim-secrets.yaml` (non versionne) :
#   cat ~/acervatim/acervatim-secrets.yaml deploy/acervatim.yaml > ~/acervatim/acervatim.yaml
#
# Les onze services partagent une pile reseau (meme pod) : ils se joignent en `localhost`,
# d'ou les `*_BASE_URL` ci-dessous. C'est la seule difference de configuration avec la stack de
# developpement, ou docker-compose les separe et les fait se resoudre par nom de service.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acervatim-config
data:
  NODE_ENV: production

  # --- Adressage interne ----------------------------------------------------------------
  # `localhost` parce que les onze conteneurs sont dans le meme pod. Un service qui sortirait
  # du pod deviendrait `http://<son-conteneur>:<port>` et rejoindrait le reseau
  # `acervatim-services` - c'est la seule ligne a changer, de chaque cote.
  IDENTITY_BASE_URL: http://localhost:3110
  BILLING_BASE_URL: http://localhost:3120
  CONNECTIONS_BASE_URL: http://localhost:3130
  SHARING_BASE_URL: http://localhost:3140
  SEARCH_BASE_URL: http://localhost:3150
  CATALOG_GENERIC_BASE_URL: http://localhost:3160
  CATALOG_MANGA_BASE_URL: http://localhost:3170
  CATALOG_VINYL_BASE_URL: http://localhost:3180
  CATALOG_LEGO_BASE_URL: http://localhost:3220
  # Catalogue LEGO de reference, lu par `search` (recherche `type=lego`). Le gateway ne le
  # route pas.
  REBRICKABLE_DATA_BASE_URL: http://localhost:3190
  GATEWAY_BASE_URL: http://localhost:3100

  # Redis et MariaDB sont HORS du pod : resolus par le DNS Podman du reseau partage.
  REDIS_HOST: acervatim-services-redis
  REDIS_PORT: '6379'
  DB_HOST: acervatim-db
  DB_PORT: '3306'

  # --- Saga RGPD (3.4) ------------------------------------------------------------------
  # **La ligne a completer en meme temps qu'on ajoute un service qui stocke un `userId`.**
  # Un participant absent d'ici ne recoit jamais de demande de suppression, et la saga
  # reussit - silencieuse et incomplete.
  #
  # `rebrickable-data` n'y figure pas, a dessein : son schema (themes, sets, traces d'import,
  # compteur de budget) ne porte aucun `userId`, et il n'expose pas `/internal/users/:id/*`.
  # L'y inscrire laisserait, a chaque suppression de compte, un job `failed` rejoue sans fin
  # sur une route qui n'existe pas.
  SAGA_PARTICIPANTS: >-
    billing=http://localhost:3120,connections=http://localhost:3130,sharing=http://localhost:3140,search=http://localhost:3150,catalog-generic=http://localhost:3160,catalog-manga=http://localhost:3170,catalog-vinyl=http://localhost:3180,catalog-lego=http://localhost:3220
  SAGA_ALERT_AFTER_HOURS: '24'

  # --- Reglages du gateway --------------------------------------------------------------
  # Fenetre pendant laquelle une perte de premium n'est pas encore effective (3.6). Assumee :
  # la perte de premium *suspend* les partages, elle ne detruit rien - et un GAIN est propage
  # immediatement par `billing`, qui invalide ce cache.
  PREMIUM_CACHE_TTL: '60'
  INTERNAL_PRINCIPAL_TTL: '120'
  PROXY_TIMEOUT_MS: '30000'
  # Vide : l'app Android n'a pas besoin de CORS, et aucun navigateur n'appelle cette API.
  CORS_ORIGINS: ''

  # --- Sources externes -----------------------------------------------------------------
  BNF_SRU_BASE_URL: https://catalogue.bnf.fr/api/SRU
  GAMEUPC_BASE_URL: https://api.gameupc.com/v1
  BGG_BASE_URL: https://boardgamegeek.com/xmlapi2
  # Catalogue LEGO (`rebrickable-data`) : la page des CSV publics de Rebrickable, sans cle.
  # Seule destination externe de ce service tant que BRICKSET_API_KEY est absente. Quatre
  # fichiers, au premier demarrage sur un catalogue vide puis une fois par jour a 03:00 UTC,
  # sous controle `Last-Modified`.
  # Aucune variable `BRICKSET_*` ici ni dans le Secret : tant que l'accord de Brickset n'est
  # pas ecrit, la cle reste absente et aucun appel ne part (cf. acervatim-secrets.example.yaml).
  # Avec la cle, Brickset n'est appele qu'au scan d'un code absent du cache. BRICKSET_BASE_URL,
  # BRICKSET_DAILY_CALL_BUDGET (90), BRICKSET_BARCODE_TTL_DAYS (90), BRICKSET_MISS_TTL_DAYS (7)
  # et BRICKSET_SCAN_WAIT_MS (6000) gardent leurs valeurs par defaut.
  REBRICKABLE_DOWNLOADS_URL: https://cdn.rebrickable.com/media/downloads
  HTTP_USER_AGENT: Acervatim-Backend/1.0 (+contact@acervatim.local)
---
apiVersion: v1
kind: Pod
metadata:
  name: acervatim
  labels:
    app: acervatim
spec:
  restartPolicy: Always

  # Les migrations des onze schemas, AVANT que le moindre service ne demarre. Une image
  # unique les joue en sequence (cf. deploy/migrate.sh) ; son echec empeche le pod de
  # demarrer, ce qui est preferable a onze services tournant sur un schema a moitie migre.
  initContainers:
    - name: migrate
      image: localhost/acervatim-migrate:0.1.0
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

  containers:
    # ------------------------------------------------------------------ point d'entree
    - name: gateway
      image: localhost/acervatim-gateway:0.1.0
      # **Le seul port publie sur l'hote.** Les dix autres services ne sont joignables que
      # depuis l'interieur du pod : c'est ce qui applique par construction l'invariant du 6 -
      # aucune route `/internal/*` n'est exposee vers l'exterieur.
      ports:
        - containerPort: 3100
          hostPort: 3100
          protocol: TCP
      env:
        - name: PORT
          value: '3100'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_GATEWAY
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    # ------------------------------------------------------------------ transverses
    - name: identity
      image: localhost/acervatim-identity:0.1.0
      env:
        - name: PORT
          value: '3110'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_IDENTITY
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    - name: billing
      image: localhost/acervatim-billing:0.1.0
      env:
        - name: PORT
          value: '3120'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_BILLING
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          # Plus haut que ses voisins : le SDK Google (`googleapis` + `google-auth-library`)
          # est la dependance la plus lourde de la constellation.
          memory: 192Mi
        limits:
          memory: 320Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    - name: connections
      image: localhost/acervatim-connections:0.1.0
      env:
        - name: PORT
          value: '3130'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_CONNECTIONS
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    - name: sharing
      image: localhost/acervatim-sharing:0.1.0
      env:
        - name: PORT
          value: '3140'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_SHARING
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 144Mi
        limits:
          memory: 224Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    - name: search
      image: localhost/acervatim-search:0.1.0
      env:
        - name: PORT
          value: '3150'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_SEARCH
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          # Le plus gourmand, et de loin : six files BullMQ avec leurs workers, le parseur
          # UNIMARC de la BnF, et les six adapters de source. C'est aussi le seul service dont
          # la consommation depend du trafic sortant plutot que du trafic entrant.
          memory: 288Mi
        limits:
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    # ------------------------------------------------------------------ catalogs par type
    - name: catalog-generic
      image: localhost/acervatim-catalog-generic:0.1.0
      env:
        - name: PORT
          value: '3160'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_CATALOG_GENERIC
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    - name: catalog-manga
      image: localhost/acervatim-catalog-manga:0.1.0
      env:
        - name: PORT
          value: '3170'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_CATALOG_MANGA
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    - name: catalog-vinyl
      image: localhost/acervatim-catalog-vinyl:0.1.0
      env:
        - name: PORT
          value: '3180'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_CATALOG_VINYL
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    # Collections LEGO des utilisateurs (2026-11-17) : clone de catalog-vinyl, memes besoins
    # memoire. Aucune cle de source, aucun appel externe ; le catalogue des sets est dans
    # rebrickable-data, lu par search.
    - name: catalog-lego
      image: localhost/acervatim-catalog-lego:0.1.0
      env:
        - name: PORT
          value: '3220'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_CATALOG_LEGO
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']

    # ------------------------------------------------------------------ donnees de reference
    # Catalogue LEGO de reference (CSV publics de Rebrickable). Service INTERNE : aucun port
    # publie, aucune route au gateway - seules `/internal/*`, `/admin/*` et `/health*` existent,
    # joignables du pod uniquement. Aucune donnee d'utilisateur, donc absent de
    # SAGA_PARTICIPANTS. Son consommateur est `search` (REBRICKABLE_DATA_BASE_URL).
    - name: rebrickable-data
      image: localhost/acervatim-rebrickable-data:0.1.0
      env:
        - name: PORT
          value: '3190'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acervatim-secrets
              key: DATABASE_URL_REBRICKABLE_DATA
      envFrom:
        - configMapRef:
            name: acervatim-config
        - secretRef:
            name: acervatim-secrets
      resources:
        # Mesure (2026-11-16, image de production, Docker) plutot qu'estimation :
        #  - catalogue vide : 120 a 140 Mo de RSS, 60 a 75 Mo vus par le cgroup ;
        #  - apres l'import : ~160 Mo de RSS au repos (V8 garde son tas), ~100 Mo au cgroup ;
        #  - pic de l'import, sur des CSV synthetiques de 40 000 sets (plus que le catalogue
        #    reel) : 170 Mo de RSS au premier import (base vide), 186 Mo au reimport sur base
        #    pleine (le passage de 03:00). Le cgroup en a vu 145 Mo : les pages du binaire Node,
        #    partagees, etaient imputees a un autre cgroup - rien ne garantit cette imputation
        #    dans le pod.
        # D'ou des requests au niveau du repos apres import, et des limits ~130 Mi au-dessus du
        # pic : un OOM pendant l'import de demarrage le relancerait a chaque redemarrage du
        # conteneur, tant que `lego_sets` reste vide.
        requests:
          memory: 192Mi
        limits:
          memory: 320Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']
